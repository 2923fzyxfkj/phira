name: Build

# CI 只负责编译各平台二进制。资源文件（assets/font.ttf、assets/background.jpg、
# assets/res）被 .gitignore 排除，不在仓库里，所以在本地组装发布包。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，用于产物命名（例如 v0.9.0）'
        required: false
        default: 'v0.9.0'
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev pkg-config

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译
        run: cargo build --release --bin phira-main --target ${{ matrix.target }}

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ github.event.inputs.version || github.ref_name }}"
          out="artifacts/Phira-${{ matrix.name }}-${ver}"
          mkdir -p "$out"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/phira-main.exe" "$out/"
          else
            cp "target/${{ matrix.target }}/release/phira-main" "$out/"
          fi
          ls -laR artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error

  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27c
      ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk-r27c
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config

      - name: 安装 Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          unzip -q commandlinetools-linux-8512546_latest.zip -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;33.0.2" "platforms;android-35"

      - name: 安装 Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -O ndk.zip
          unzip -q ndk.zip -d "${{ github.workspace }}"

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          cargo install cargo-ndk

      - name: 编译
        working-directory: phira
        run: cargo ndk -t ${{ matrix.abi }} --platform 35 build --release

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ github.event.inputs.version || github.ref_name }}"
          out="artifacts/Phira-android-${{ matrix.abi }}-${ver}"
          mkdir -p "$out"
          so=$(find . -path "*/${{ matrix.target }}/release/libphira.so" -print -quit)
          test -n "$so"
          cp "$so" "$out/"
          ls -laR artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: artifacts/
          if-no-files-found: error
