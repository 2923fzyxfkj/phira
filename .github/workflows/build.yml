name: Build

# 编译各平台二进制 → 在 Linux 发布任务里补齐资源、打包 → 挂到 GitHub Release。
#
# 为什么资源要在 CI 里补：assets/font.ttf、assets/background.jpg、assets/res 被 .gitignore
# 排除，不在仓库里。上游任一发布包的 assets/ 即为完整集合（已与本地逐文件核对一致），
# 所以直接取上游 Windows 包解出 assets/ 复用。
#
# 为什么打包统一放在 Linux 任务：Windows runner 的 Git Bash 没有 zip，
# 各平台自己打包会分裂出两套命令，放一处最省心。
#
# 为什么 Android 产物是「替换 so 的 APK」而不是自己编译的 APK：
# 本仓库没有 Android 前端工程（无 gradle / manifest / Java 源码），官方 APK 是唯一可用的
# 宿主外壳。官方文档 phira-docs《Android》给的就是这条路子：拿官方 APK 换 lib/<abi>/libphira.so
# 后重新签名。换上去的 so 必须导出 quad_native.QuadNative 的全套 JNI 符号，否则
# System.loadLibrary 后首次调用就会 UnsatisfiedLinkError —— 其中 preprocessInput 上游
# miniquad 模板不带、官方私有实现不开源，由 phira/src/lib.rs 补一个空实现兜住。
#
# 触发方式只能是 push tag —— workflow_dispatch 要求工作流存在于默认分支，
# 而本工作流刻意放在 release 分支，避免污染 PR #901 的 diff。

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # 上游发布包：既提供被 .gitignore 排除的 assets/，也提供 Android 宿主 APK
  UPSTREAM_TAG: v0.8.2
  ASSET_SOURCE_URL: https://github.com/TeamFlos/phira/releases/download/v0.8.2/Phira-windows-x86_64-v0.8.2.zip
  # APK 重签名用的 keystore（keytool 生成，别名 phira，口令 phira-noise，有效期 10000 天）。
  # 明文公开无风险：这只是个人 fork 的非官方测试包，keystore 里没有任何敏感信息。
  # 固定下来是为了让每次构建的签名一致，从而可以覆盖安装升级。
  KEYSTORE_B64: ""

permissions:
  contents: write

jobs:
  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev pkg-config

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # prpr-avc/build.rs 无条件发出 `cargo:rustc-link-lib=z`，Windows MSVC 没有 zlib，
      # 链接会报 LNK1181: cannot open input file 'z.lib'。这里从源码编静态 zlib 补上。
      - name: 准备 zlib（Windows MSVC）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ('${{ matrix.target }}'.StartsWith('aarch64')) { 'ARM64' } else { 'x64' }
          git clone --depth 1 -b v1.3.1 https://github.com/madler/zlib.git "$env:RUNNER_TEMP\zlib-src"
          cmake -S "$env:RUNNER_TEMP\zlib-src" -B "$env:RUNNER_TEMP\zlib-build" -A $arch `
            -DZLIB_BUILD_SHARED=OFF -DZLIB_BUILD_STATIC=ON
          cmake --build "$env:RUNNER_TEMP\zlib-build" --config Release
          $lib = Get-ChildItem "$env:RUNNER_TEMP\zlib-build" -Recurse -Filter '*.lib' |
            Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $lib) { throw 'zlib build produced no .lib' }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\zlib-lib" | Out-Null
          Copy-Item $lib.FullName "$env:RUNNER_TEMP\zlib-lib\z.lib" -Force
          "LIB=$env:RUNNER_TEMP\zlib-lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "z.lib <- $($lib.FullName) ($($lib.Length) bytes)"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译
        run: cargo build --release --bin phira-main --target ${{ matrix.target }}

      - name: 收集二进制
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/phira-main.exe" dist/
          else
            cp "target/${{ matrix.target }}/release/phira-main" dist/
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27c
      ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk-r27c
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config

      - name: 安装 Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          unzip -q commandlinetools-linux-8512546_latest.zip -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;33.0.2" "platforms;android-35"

      - name: 安装 Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -O ndk.zip
          unzip -q ndk.zip -d "${{ github.workspace }}"

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          cargo install cargo-ndk

      - name: 编译
        working-directory: phira
        run: cargo ndk -t ${{ matrix.abi }} --platform 35 build --release

      # 官方 APK 是唯一可用的宿主外壳：本仓库没有 Android 前端工程。
      # 换 so 后必须重新签名才能安装，顺序固定为「替换 → zipalign → apksigner」。
      - name: 组装并签名 APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          abi="${{ matrix.abi }}"
          ver="${GITHUB_REF_NAME}"
          bt="$ANDROID_HOME/build-tools/33.0.2"

          so=$(find . -path "*/${{ matrix.target }}/release/libphira.so" -print -quit)
          test -n "$so"
          echo "so: $so ($(stat -c%s "$so") bytes)"

          curl -sSL --fail -o "$RUNNER_TEMP/base.apk" \
            "https://github.com/TeamFlos/phira/releases/download/${UPSTREAM_TAG}/Phira-android-${abi}-${UPSTREAM_TAG}.apk"
          echo "base.apk: $(stat -c%s "$RUNNER_TEMP/base.apk") bytes"

          mkdir -p dist
          python3 ci/make_apk.py "$RUNNER_TEMP/base.apk" "$so" "$abi" "$RUNNER_TEMP/unsigned.apk"

          # -p 让未压缩的 .so 按页对齐（Android 15 起要求 16KB 页），4 是其余条目的基础对齐
          "$bt/zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"

          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          "$bt/apksigner" sign \
            --ks "$RUNNER_TEMP/ks.jks" \
            --ks-key-alias phira \
            --ks-pass pass:phira-noise \
            --key-pass pass:phira-noise \
            --out "dist/Phira-android-${abi}-${ver}.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "$bt/apksigner" verify --print-certs "dist/Phira-android-${abi}-${ver}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error

  release:
    name: 组装并发布
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有二进制
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 补齐资源并打包
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          out="$PWD/dist"
          rm -rf upstream stage
          mkdir -p upstream "$out" stage

          # 上游包是扁平结构（LICENSE / assets / phira-main.exe），资源部分直接复用
          curl -sSL --fail -o upstream.zip "$ASSET_SOURCE_URL"
          unzip -q upstream.zip 'assets/*' 'LICENSE' -d upstream

          for d in artifacts/*/; do
            name=$(basename "$d")
            case "$name" in
              android-*)
                # 已经是签好名的完整 APK，直接用
                abi="${name#android-}"
                cp "$d"*.apk "$out/Phira-android-${abi}-${ver}.apk"
                ;;
              *)
                stage_dir="stage/$name"
                mkdir -p "$stage_dir"
                cp -r upstream/assets upstream/LICENSE "$stage_dir/"
                cp "$d"* "$stage_dir/"
                (cd "$stage_dir" && zip -qr9 "$out/Phira-${name}-${ver}.zip" .)
                ;;
            esac
          done

      - name: 列出发布包
        run: ls -la dist

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=(dist/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "Phira $tag" --notes-file ci/release-notes.md
          fi
