name: Build

# 编译各平台二进制 → 补齐资源 → 打发布包 → 挂到 GitHub Release。
#
# 之所以要在 CI 里补资源：assets/font.ttf、assets/background.jpg、assets/res 被 .gitignore
# 排除，不在仓库里。上游任一发布包的 assets/ 即为完整集合（已与本地逐文件核对一致），
# 所以直接取 v0.8.2 的 Windows 包解出 assets/ 复用。
#
# 触发方式只能是 push tag —— workflow_dispatch 要求工作流存在于默认分支，
# 而本工作流刻意放在 release 分支，避免污染 PR #901 的 diff。

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  ASSET_SOURCE_URL: https://github.com/TeamFlos/phira/releases/download/v0.8.2/Phira-windows-x86_64-v0.8.2.zip

permissions:
  contents: write

jobs:
  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev pkg-config

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # prpr-avc/build.rs 无条件发出 `cargo:rustc-link-lib=z`，Windows MSVC 没有 zlib，
      # 链接会报 LNK1181: cannot open input file 'z.lib'。这里从源码编静态 zlib 补上。
      - name: 准备 zlib（Windows MSVC）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ('${{ matrix.target }}'.StartsWith('aarch64')) { 'ARM64' } else { 'x64' }
          git clone --depth 1 -b v1.3.1 https://github.com/madler/zlib.git "$env:RUNNER_TEMP\zlib-src"
          cmake -S "$env:RUNNER_TEMP\zlib-src" -B "$env:RUNNER_TEMP\zlib-build" -A $arch `
            -DZLIB_BUILD_SHARED=OFF -DZLIB_BUILD_STATIC=ON
          cmake --build "$env:RUNNER_TEMP\zlib-build" --config Release
          $lib = Get-ChildItem "$env:RUNNER_TEMP\zlib-build" -Recurse -Filter '*.lib' |
            Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $lib) { throw 'zlib build produced no .lib' }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\zlib-lib" | Out-Null
          Copy-Item $lib.FullName "$env:RUNNER_TEMP\zlib-lib\z.lib" -Force
          "LIB=$env:RUNNER_TEMP\zlib-lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "z.lib <- $($lib.FullName) ($($lib.Length) bytes)"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译
        run: cargo build --release --bin phira-main --target ${{ matrix.target }}

      - name: 组装发布包
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ver="${GITHUB_REF_NAME}"
          stage="$PWD/.pkg-stage"
          out="$PWD/dist/Phira-${{ matrix.name }}-${ver}.zip"
          rm -rf "$stage"
          mkdir -p "$stage" "$PWD/dist"

          # 取上游包里被 .gitignore 排除的资源（font.ttf / background.jpg / res）
          curl -sSL --fail -o "$PWD/upstream.zip" "$ASSET_SOURCE_URL"
          unzip -q "$PWD/upstream.zip" 'assets/*' -d "$stage"

          cp LICENSE "$stage/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/phira-main.exe" "$stage/"
          else
            cp "target/${{ matrix.target }}/release/phira-main" "$stage/"
          fi

          # 上游包是扁平结构（LICENSE / assets / phira-main.exe），不带外层目录
          (cd "$stage" && zip -qr9 "$out" .)
          ls -la "$PWD/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27c
      ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk-r27c
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config

      - name: 安装 Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          unzip -q commandlinetools-linux-8512546_latest.zip -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;33.0.2" "platforms;android-35"

      - name: 安装 Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -O ndk.zip
          unzip -q ndk.zip -d "${{ github.workspace }}"

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          cargo install cargo-ndk

      - name: 编译
        working-directory: phira
        run: cargo ndk -t ${{ matrix.abi }} --platform 35 build --release

      - name: 打包 libphira.so
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ver="${GITHUB_REF_NAME}"
          mkdir -p "$PWD/dist"
          so=$(find . -path "*/${{ matrix.target }}/release/libphira.so" -print -quit)
          test -n "$so"
          zip -qj "$PWD/dist/Phira-android-${{ matrix.abi }}-${ver}-so.zip" "$so"
          ls -la "$PWD/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error

  release:
    name: 发布
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待上传文件
        run: ls -la dist

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.zip --title "Phira $tag" --notes-file ci/release-notes.md
          fi
